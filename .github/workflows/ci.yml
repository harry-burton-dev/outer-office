name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install, typecheck, every test suite and the build with its size
      # budgets. The bootstrap needs a public key; CI uses a throwaway one.
      - name: CI
        run: |
          export TRELLIS_PUBLIC_KEY="$(npm run --silent keygen | sed -n 's/^TRELLIS_PUBLIC_KEY=//p')"
          npm run ci
      - name: Install a browser
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      # The gates: boundary, real keys, two users from built files, the
      # from-disk smoke test, backup and restore, engine probes, size budgets.
      # Three gates test the framework repository itself and are reported as
      # not applicable here.
      - name: Rubric
        run: |
          export TRELLIS_PUBLIC_KEY="$(npm run --silent keygen | sed -n 's/^TRELLIS_PUBLIC_KEY=//p')"
          npm run rubric
